<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="su6osec">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171b23"/>
      <stop offset="55%" stop-color="#0b0e13"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
  </defs>

  <!-- round disc -->
  <circle cx="32" cy="32" r="32" fill="url(#disc)"/>
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="#4ff0b4" stroke-opacity="0.32" stroke-width="1.5"/>

  <!-- signal arcs radiating from the origin node -->
  <g fill="none" stroke="#4ff0b4" stroke-width="4.5" stroke-linecap="round">
    <path d="M20 34 A10 10 0 0 1 30 44" stroke-opacity="0.4"/>
    <path d="M20 24 A20 20 0 0 1 40 44" stroke-opacity="0.68"/>
    <path d="M20 14 A30 30 0 0 1 50 44" stroke-opacity="1"/>
  </g>

  <circle cx="20" cy="44" r="5" fill="#4ff0b4"/>
  <circle cx="20" cy="44" r="9" fill="none" stroke="#4ff0b4" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>
