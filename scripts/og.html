<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <style>
      /* Self-hosted brand face — the placeholder is filled with base64 by
         scripts/generate-assets.mjs so the card renders without network
         font requests of its own. */
      @font-face {
        font-family: 'Clash Display';
        font-weight: 600;
        src: url(data:font/woff2;base64,__CLASH_600__) format('woff2');
      }
      @font-face {
        font-family: 'Clash Display';
        font-weight: 700;
        src: url(data:font/woff2;base64,__CLASH_700__) format('woff2');
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { width: 1200px; height: 630px; overflow: hidden; }

      body {
        position: relative;
        background: #07080a;
        color: #edeff2;
        font-family: 'Inter', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px 56px;
      }

      /* hairline grid */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
        background-size: 74px 74px;
        mask-image: radial-gradient(ellipse 85% 80% at 70% 10%, #000 15%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse 85% 80% at 70% 10%, #000 15%, transparent 75%);
      }

      .glow-a, .glow-b { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .3; }
      .glow-a { width: 460px; height: 460px; top: -180px; right: -120px; background: #4ff0b4; }
      .glow-b { width: 420px; height: 420px; bottom: -220px; left: -140px; background: #8a7bff; opacity: .22; }

      /* constellation */
      .mesh { position: absolute; inset: 0; opacity: .55; }

      header, main, footer { position: relative; z-index: 2; }

      header { display: flex; align-items: center; justify-content: space-between; }

      .brand { display: flex; align-items: center; gap: 16px; }
      .mark {
        width: 56px; height: 56px; border-radius: 50%;
        background: #0d1015;
        border: 1.5px solid rgba(79,240,180,.35);
        display: grid; place-items: center;
      }
      .brand-name {
        font-family: 'Clash Display', 'Space Grotesk', sans-serif;
        font-weight: 600; font-size: 30px; letter-spacing: -.02em;
      }
      .brand-name span { color: #4ff0b4; }

      .avail {
        display: flex; align-items: center; gap: 12px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 17px; letter-spacing: .16em; text-transform: uppercase;
        color: #9ba3af;
        padding: 13px 24px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 999px;
        background: rgba(255,255,255,.04);
      }
      .dot { position: relative; width: 11px; height: 11px; border-radius: 50%; background: #4ff0b4; }
      .dot::after {
        content: ''; position: absolute; inset: 0; border-radius: 50%;
        background: #4ff0b4; opacity: .6;
        animation: pulse 2.2s ease-out infinite;
      }
      @keyframes pulse { 0% { transform: scale(1); opacity: .6 } 70%,100% { transform: scale(3); opacity: 0 } }

      main { display: flex; flex-direction: column; gap: 26px; }

      h1 {
        font-family: 'Clash Display', 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 96px;
        line-height: .92;
        letter-spacing: -.03em;
      }
      h1 .outline {
        color: transparent;
        -webkit-text-stroke: 2px rgba(255,255,255,.32);
      }
      h1 em {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-weight: 400;
        color: #4ff0b4;
        letter-spacing: -.01em;
      }

      .role {
        font-size: 27px;
        color: #9ba3af;
        line-height: 1.5;
        max-width: 830px;
      }
      .role strong { color: #edeff2; font-weight: 600; }

      footer {
        display: flex; align-items: center; justify-content: space-between;
        padding-top: 30px;
        border-top: 1px solid rgba(255,255,255,.1);
      }

      .stats { display: flex; gap: 56px; }
      .stat b {
        display: block;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 34px; font-weight: 700; letter-spacing: -.03em;
        color: #4ff0b4;
      }
      .stat span {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px; letter-spacing: .18em; text-transform: uppercase;
        color: #6a717d;
      }

      .url {
        font-family: 'JetBrains Mono', monospace;
        font-size: 21px; letter-spacing: .04em; color: #9ba3af;
      }
      .url span { color: #edeff2; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow-a"></div>
    <div class="glow-b"></div>
    <svg class="mesh" viewBox="0 0 1200 630" preserveAspectRatio="none">
      <g stroke="#4ff0b4" stroke-opacity=".18" stroke-width="1">
        <line x1="905" y1="70" x2="1010" y2="150"/><line x1="1010" y1="150" x2="1120" y2="95"/>
        <line x1="1010" y1="150" x2="1075" y2="255"/><line x1="1075" y1="255" x2="1165" y2="300"/>
        <line x1="905" y1="70" x2="860" y2="185"/><line x1="860" y1="185" x2="950" y2="245"/>
        <line x1="950" y1="245" x2="1075" y2="255"/><line x1="860" y1="185" x2="790" y2="120"/>
        <line x1="1120" y1="95" x2="1175" y2="190"/><line x1="950" y1="245" x2="985" y2="360"/>
      </g>
      <g fill="#4ff0b4">
        <circle cx="905" cy="70" r="3.5"/><circle cx="1010" cy="150" r="4.5"/>
        <circle cx="1120" cy="95" r="3"/><circle cx="1075" cy="255" r="4"/>
        <circle cx="1165" cy="300" r="3"/><circle cx="860" cy="185" r="4"/>
        <circle cx="950" cy="245" r="3.5"/><circle cx="790" cy="120" r="2.5"/>
        <circle cx="1175" cy="190" r="3"/><circle cx="985" cy="360" r="3"/>
      </g>
    </svg>

    <header>
      <div class="brand">
        <div class="mark">
          <svg width="34" height="34" viewBox="0 0 64 64" fill="none">
            <g stroke="#4ff0b4" stroke-width="5" stroke-linecap="round">
              <path d="M20 34 A10 10 0 0 1 30 44" stroke-opacity=".5"/>
              <path d="M20 24 A20 20 0 0 1 40 44" stroke-opacity=".75"/>
              <path d="M20 14 A30 30 0 0 1 50 44"/>
            </g>
            <circle cx="20" cy="44" r="5.5" fill="#4ff0b4"/>
            <defs>
              <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#4ff0b4"/><stop offset="1" stop-color="#8a7bff"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-name">su6osec<span>.</span></div>
      </div>
      <div class="avail"><span class="dot"></span> Open to opportunities</div>
    </header>

    <main>
      <h1>Deepanshu<br /><span class="outline">Chauhan</span></h1>
      <p class="role">
        <strong>Cloud &amp; Offensive Security Engineer</strong> — enterprise cloud operations,
        penetration testing and open-source security tooling.
      </p>
    </main>

    <footer>
      <div class="stats">
        <div class="stat"><b>100%</b><span>Report acceptance</span></div>
        <div class="stat"><b>Top 5%</b><span>TryHackMe</span></div>
        <div class="stat"><b>39+</b><span>Recon sources</span></div>
      </div>
      <div class="url"><span>su6osec</span>.vercel.app</div>
    </footer>
  </body>
</html>
